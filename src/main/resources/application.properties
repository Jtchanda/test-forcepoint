spring.application.name=bancassurance-payments-service
server.port=${SERVER_PORT:8005}
spring.profiles.active=${ACTIVE_PROFILE:develop}

spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL:update}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}

bancassurance.kafka.url=${BANCASSURANCE_KAFKA_URL:}
