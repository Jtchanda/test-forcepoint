#name: bancassurance
services:

  payments-service:
    container_name: bancassurance-payments-service
    image: bancassurance-payments-service
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
    ports:
      - "8005:8005"
    networks:
      - bancassurance-network

  postgres:
    container_name: bancassurance-payments-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - bancassurance_payments_db:/var/lib/postgresql/data
    networks:
      - bancassurance-network

  apache-kafka:
    container_name: bancassurance-payments-kafka
    image: apache/kafka
    networks:
      - bancassurance-network

volumes:
  bancassurance_payments_db:
    name: bancassurance-payments-db
    driver: local

networks:
  bancassurance-network:
    name: bancassurance-network
    driver: bridge